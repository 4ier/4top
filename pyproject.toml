[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "4top"
version = "0.2.0a4"
description = "Your coding agents, one terminal. Find, search and resume native sessions, locally or over SSH."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "4ier"}]
dependencies = ["session-ls>=0.2.0,<0.3", "textual>=8.2.8,<9"]
keywords = ["coding-agents", "terminal", "session-history", "claude", "codex", "pi", "ssh"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console :: Curses",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/4ier/4top"
Issues = "https://github.com/4ier/4top/issues"

[project.scripts]
4top = "fourtop.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "pexpect>=4.9,<5", "ruff>=0.16,<0.17", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# session-ls is an ordinary dependency. It has its own repository
# (https://github.com/4ier/session-ls) and its own pipeline, and is consumed from
# PyPI here, which is why this project has no workspace or source override.
