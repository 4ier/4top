name: 4top validation
on:
  push:
    branches: [main, '4top/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 4top-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      FOURTOP_TEST_REQUIRE_TMUX: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y tmux
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux
      - name: Install exact development dependencies and both packages
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e packages/session-ls -e .
      - name: Lint and unit/headless tests
        run: |
          python -m ruff check .
          python -m pytest -p pytest_asyncio.plugin tests/unit tests/tui packages/session-ls/tests --junitxml=unit.xml
      - name: Real tmux / PTY tests (synthetic agents, no credentials)
        run: python -m pytest -p pytest_asyncio.plugin tests/integration --junitxml=runtime.xml
      - name: Build both distributions
        run: |
          python -m build --no-isolation packages/session-ls --outdir dist
          python -m build --no-isolation --outdir dist
          python scripts/verify_install.py dist
      - name: Environment evidence
        if: always()
        run: |
          python --version > environment.txt
          tmux -V >> environment.txt
          uname -a >> environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4top-validation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            *.xml
            environment.txt
            dist/*
          retention-days: 14
  core-python39:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.9'}
      - run: |
          python -m pip install 'pytest<9' ./packages/session-ls
          python -c 'from session_ls.api import HistoryIndex, Root'
          python -m pytest packages/session-ls/tests
