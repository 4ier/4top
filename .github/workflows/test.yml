name: 4top validation
on:
  push:
    branches: [main, '4top/**']
  pull_request:
  workflow_dispatch:
  # Reused by publish.yml, so a release cannot outrun the suite.
  workflow_call:
permissions:
  contents: read
concurrency:
  group: 4top-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - name: Install exact development dependencies and this package
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Documentation still describes the code
        run: python scripts/check_docs.py
      - name: Lint and unit/headless tests
        run: |
          python -m ruff check .
          python -m pytest -p pytest_asyncio.plugin tests/unit tests/tui --junitxml=unit.xml
      - name: Real-process launch and ssh transport tests
        run: python -m pytest -p pytest_asyncio.plugin tests/integration --junitxml=launch.xml
      - name: Repeat launch regressions
        run: |
          for attempt in 1 2 3; do
            python -m pytest -p pytest_asyncio.plugin -q tests/integration/test_launch.py
          done
      - name: Build the distribution
        run: |
          python -m build --no-isolation --outdir dist
          python scripts/verify_install.py dist
      - name: Environment evidence
        if: always()
        run: |
          python --version > environment.txt
          uname -a >> environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4top-validation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            *.xml
            environment.txt
            dist/*
          retention-days: 14
