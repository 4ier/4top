name: publish

# Publishing is a tag, nothing else. Push v<version> after the version in
# pyproject.toml matches it, and CI runs the suite, gates the release, publishes
# session-ls before 4top (the root requires it) and opens the GitHub release.
#
# Both uploads use PyPI trusted publishing: no token is stored in this repository.
# Configure one publisher per project on PyPI, pointing at owner 4ier, repository
# 4top and workflow publish.yml, with these environment names:
#   session-ls -> pypi-session-ls
#   4top       -> pypi-4top
# The environment is what distinguishes two otherwise identical publishers, and each
# project publishes from its own job so the OIDC exchange mints the right token.
#
# The manual trigger defaults to a dry run so the same path can be rehearsed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without uploading
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  verify:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      session_ls: ${{ steps.decide.outputs.session_ls }}
      root: ${{ steps.decide.outputs.root }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install the pinned build environment
        # The same pinned set the suite was validated with, so --no-isolation has the
        # backend it needs instead of failing with "Cannot import setuptools.build_meta".
        run: python -m pip install -r requirements-dev.lock
      - name: Gate the release
        run: |
          tag=""
          if [ "${{ github.event_name }}" = "push" ]; then tag="$GITHUB_REF_NAME"; fi
          python scripts/check_release.py $tag
      - name: Build both distributions
        run: |
          python -m build --no-isolation packages/session-ls --outdir dist
          python -m build --no-isolation --outdir dist
      - name: The artifacts are the versions we validate
        run: |
          tag=""
          if [ "${{ github.event_name }}" = "push" ]; then tag="$GITHUB_REF_NAME"; fi
          python scripts/check_release.py $tag --dist dist
      - name: Install both wheels into a fresh environment
        run: python scripts/verify_install.py dist
      - name: Split the uploads, session-ls first
        run: |
          mkdir -p upload-session-ls upload-root
          mv dist/*session_ls* upload-session-ls/ || true
          mv dist/* upload-root/ || true
          ls -l upload-session-ls upload-root
      - name: Decide what is new, so an existing version is skipped
        id: decide
        run: |
          tag=""
          if [ "${{ github.event_name }}" = "push" ]; then tag="$GITHUB_REF_NAME"; fi
          python scripts/check_release.py $tag --dist dist --decide >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            upload-session-ls/*
            upload-root/*

  # One job per project: the OIDC exchange mints a token for the project its
  # publisher matches, so two projects in one job would reuse one project's token.
  # The environment is what tells two otherwise identical publishers apart.
  publish-session-ls:
    needs: verify
    if: needs.verify.outputs.session_ls == 'new' && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-24.04
    environment: pypi-session-ls
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: distributions}
      - name: Publish session-ls
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./upload-session-ls
          print-hash: true

  publish-root:
    needs: [verify, publish-session-ls]
    # `!cancelled()` because a skipped dependency (the version already exists) must
    # not take this job down with it.
    if: |
      !cancelled() && needs.verify.outputs.root == 'new' &&
      (needs.publish-session-ls.result == 'success' || needs.publish-session-ls.result == 'skipped') &&
      (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-24.04
    environment: pypi-4top
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: distributions}
      - name: Publish 4top, which requires session-ls
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./upload-root
          print-hash: true

  release:
    needs: [publish-session-ls, publish-root]
    # Only a tag is a release; the manual trigger rehearses the build and the gate.
    if: |
      !cancelled() && github.event_name == 'push' &&
      (needs.publish-session-ls.result == 'success' || needs.publish-session-ls.result == 'skipped') &&
      (needs.publish-root.result == 'success' || needs.publish-root.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: distributions}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes upload-*/*
          fi
