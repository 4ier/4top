name: publish

# Publishing is a tag, nothing else. Push v<version> after the version in
# pyproject.toml matches it, and CI runs the suite, gates the release, publishes
# 4top and opens the GitHub release.
#
# This repository publishes one project. `session-ls` has its own repository and its
# own pipeline and is consumed here as an ordinary PyPI dependency, so there is no
# cross-project ordering, no second upload and no second publisher to disambiguate.
#
# The upload uses PyPI trusted publishing: no token is stored in this repository.
# It needs one publisher on PyPI for project `4top`, pointing at owner 4ier,
# repository 4top, workflow publish.yml and environment pypi.
#
# The manual trigger defaults to a dry run so the same path can be rehearsed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without uploading
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  verify:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      root: ${{ steps.decide.outputs.root }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install the pinned build environment
        # The same pinned set the suite was validated with, so --no-isolation has the
        # backend it needs instead of failing with "Cannot import setuptools.build_meta".
        run: python -m pip install -r requirements-dev.lock
      - name: Gate the release
        run: |
          tag=""
          if [ "${{ github.event_name }}" = "push" ]; then tag="$GITHUB_REF_NAME"; fi
          python scripts/check_release.py $tag
      - name: Build the distribution
        run: python -m build --no-isolation --outdir dist
      - name: The artifacts are the versions we validate
        run: |
          tag=""
          if [ "${{ github.event_name }}" = "push" ]; then tag="$GITHUB_REF_NAME"; fi
          python scripts/check_release.py $tag --dist dist
      - name: Install the wheel into a fresh environment
        run: python scripts/verify_install.py dist
      - name: Decide what is new, so an existing version is skipped
        id: decide
        run: |
          tag=""
          if [ "${{ github.event_name }}" = "push" ]; then tag="$GITHUB_REF_NAME"; fi
          python scripts/check_release.py $tag --dist dist --decide >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  publish:
    needs: verify
    if: needs.verify.outputs.root == 'new' && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish 4top
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./dist
          print-hash: true
          # A re-run of a release must not fail on its own upload.
          skip-existing: true

      - name: Wait until PyPI serves the new version
        # A freshly uploaded version is not visible on every CDN edge at once, so
        # anything that pins it immediately (a downstream lock file, for instance)
        # can race the release. Fail loudly instead of leaving that to the next job.
        run: |
          read -r name version < <(python - <<'PY'
          import tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          print(project["name"], project["version"])
          PY
          )
          for attempt in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/${name}/${version}/json" >/dev/null 2>&1; then
              echo "PyPI serves ${name} ${version}"
              exit 0
            fi
            sleep 10
          done
          echo "PyPI did not serve ${name} ${version} within five minutes" >&2
          exit 1

  release:
    needs: publish
    # Only a tag is a release; the manual trigger rehearses the build and the gate.
    # A skipped publish (the version already exists) still deserves a release.
    if: |
      !cancelled() && github.event_name == 'push' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: upload
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
          fi
